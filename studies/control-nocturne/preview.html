/* Prevent intrinsic grid min-size overflow; table and terminal content scroll *inside* panels. */
.stack,.panel,.layout,.datagrid,.two-up,.chatlayout { min-width: 0; }
.topomap { width: 100%; max-width: 100%; }
#toast[hidden] { display:none; }

/* Lucide is a real, locally bundled SVG icon library (no fake Unicode pictograms or CDN). */
/* Fix inherited full-size SVG rules on the topology map nodes. */
.topomap .netnode .lucide-icon{position:static;width:13px;height:13px;inset:auto}
.net-inspector .rowval{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:11px 0;font:11px/1.6 monospace}
.net-inspector .rowval span{color:var(--mute)}
.net-inspector .rowval b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.nav button:hover:not([aria-current="page"]){background:transparent;border-color:transparent;color:var(--ink)}
.lucide-sprite{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.lucide-icon{display:inline-block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ni{display:inline-flex;align-items:center;justify-content:center;min-width:19px}
.brand .glyph{transform:none}
.iconbtn,.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.avatar .lucide-icon{width:16px;height:16px}
.rail-host,.m-title{display:inline-flex;align-items:center;gap:7px}
.badge.offline{color:var(--mute);border-color:var(--strong);background:var(--raised)}
.host-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:17px}
.host-card{min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--raised);padding:15px;display:flex;flex-direction:column;gap:13px}
.host-card-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.host-title-label{display:flex;gap:9px;align-items:flex-start;min-width:0}
.host-title-label strong{font-size:14px;font-weight:750}
.host-card .host-sub{margin-top:5px;color:var(--mute);font:10px/1.5 monospace;overflow-wrap:anywhere}
.host-resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.host-resource{min-width:0}
.host-resource-label{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-bottom:5px;font:10px/1.4 monospace;color:var(--sub)}
.host-resource-label span:first-child{display:inline-flex;align-items:center;gap:5px}
.host-resource-label strong{font-weight:650;color:var(--ink);white-space:nowrap}
.host-resource-track{height:5px;overflow:hidden;border-radius:3px;background:var(--line)}
.host-resource-track b{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:3px;max-width:100%}
.host-resource-track b.disk{background:linear-gradient(90deg,var(--cyan),var(--green))}
.host-resource-track b.cpu{background:linear-gradient(90deg,var(--green),var(--amber))}
.host-resource-track b.gpu{background:linear-gradient(90deg,var(--cyan),var(--mag))}
.host-resource-track b.empty{background:transparent}
.host-network{display:flex;gap:5px;align-items:center;color:var(--sub);font:10px/1.5 monospace;min-width:0;overflow-wrap:anywhere}
.process-caption{font:10px/1.6 monospace;letter-spacing:.09em;color:var(--mute);margin-bottom:7px}
.process-header,.process-row{display:grid;grid-template-columns:minmax(0,1fr) 50px 78px;gap:7px;align-items:center;font:10px/1.5 monospace}
.process-header{color:var(--mute);margin-bottom:3px}
.process-row{padding:6px 0;border-top:1px solid var(--line)}
.process-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.process-row .val{text-align:right;color:var(--sub);white-space:nowrap}
.process-empty{padding:13px 0;color:var(--mute);font:11px/1.6 monospace}
.host-card .btn{align-self:flex-start}
.netnode{cursor:pointer}
.netnode[aria-pressed="true"]{border-color:var(--violet);box-shadow:0 0 0 2px color-mix(in srgb,var(--violet) 15%,transparent)}
.netnode strong{display:inline-flex;align-items:center;gap:5px}
.netnode:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.net-inspector{padding:15px 17px}
.net-inspector .host-resource-grid{margin:13px 0}
.net-inspector .process-list{margin-top:17px}
.workload-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 18px 17px}
.workload-resource{background:var(--raised);padding:14px;border:1px solid var(--line);border-radius:9px;min-width:0}
.workload-resource .process-list{margin-top:13px}
.workload-topline{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.workload-topline strong{font-size:12px}
.icon-catalog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 18px 20px}
.icon-sample{min-width:0;border:1px solid var(--line);background:var(--raised);border-radius:7px;padding:12px 5px;display:flex;gap:7px;align-items:center;justify-content:center;flex-direction:column;color:var(--sub)}
.icon-sample .lucide-icon{color:var(--violet)}
.icon-sample code{font:10px monospace;overflow-wrap:anywhere;text-align:center}
.termprocess-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px 15px 18px;background:#090a12}
.termprocess{min-width:0;border:1px solid #554a6f;padding:11px;color:#b8b0cb;font:11px/1.65 "JetBrains Mono",monospace}
.termprocess .head{color:#bca4ff;margin-bottom:4px}
.termprocess .procrow{display:grid;grid-template-columns:minmax(0,1fr) 55px 60px;gap:4px}
.termprocess .procrow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1150px){.host-grid,.workload-info{grid-template-columns:minmax(0,1fr)}}
@media(max-width:870px){.host-grid,.workload-info{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.host-grid,.workload-info,.termprocess-grid{grid-template-columns:minmax(0,1fr)}.icon-catalog{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:400px){.host-resource-grid{grid-template-columns:minmax(0,1fr)}.icon-catalog{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>

function hostById(id){return DEMO_HOSTS.find(h=>h.id===id)}
function percent(used,total){return Number.isFinite(used)&&Number.isFinite(total)&&total>0?used/total*100:null}
function fmtNum(v){return Number.isFinite(v)?(Number.isInteger(v)?String(v):v.toFixed(1)):'—'}
function resourceMeter(name,iconName,value,percentage,kind=''){
 const valid=Number.isFinite(percentage);const pct=valid?Math.max(0,Math.min(100,percentage)):0;
 return `<div class="host-resource"><div class="host-resource-label"><span>${icon(iconName,12)} ${escapeHtml(name)}</span><strong>${escapeHtml(value)}</strong></div><div class="host-resource-track" ${valid?`role="progressbar" aria-label="${escapeHtml(name)}" aria-valuenow="${pct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100"`:'aria-label="Нет данных"'}><b class="${kind}${valid?'':' empty'}" style="width:${pct.toFixed(1)}%"></b></div></div>`
}
function processTable(processes,available=true){
 if(!available)return `<div class="process-empty">INACTIVE · no running processes</div>`;
 if(!Array.isArray(processes)||processes.length===0)return `<div class="process-empty">N/A · process collector unavailable</div>`;
 const top=[...processes].sort((a,b)=>b.cpu-a.cpu).slice(0,3);
 return `<div class="process-header"><span>PROCESS / PID</span><span style="text-align:right">CPU</span><span style="text-align:right">RAM</span></div>${top.map(p=>`<div class="process-row"><span class="process-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)} <small style="color:var(--mute)">${p.pid}</small></span><span class="val">${fmtNum(p.cpu)}%</span><span class="val">${escapeHtml(p.ram)}</span></div>`).join('')}`
}
function hostMetrics(h){return `<div class="host-resource-grid">${resourceMeter('CPU','cpu',h.cpu===null?'N/A':h.cpu+'%',h.cpu,'cpu')}${resourceMeter('RAM','memory-stick',fmtNum(h.ramUsed)+' / '+fmtNum(h.ramTotal)+' GiB',percent(h.ramUsed,h.ramTotal))}${resourceMeter('DISK','hard-drive',fmtNum(h.diskUsed)+' / '+fmtNum(h.diskTotal)+' GiB',percent(h.diskUsed,h.diskTotal),'disk')}${h.gpu?resourceMeter('GPU VRAM','gauge',fmtNum(h.gpu.used)+' / '+fmtNum(h.gpu.total)+' GiB',percent(h.gpu.used,h.gpu.total),'gpu'):`<div class="host-network">${icon('activity',13)} NET&nbsp; RX ${h.rx===null?'N/A':h.rx+' Mb/s'}<br>TX ${h.tx===null?'N/A':h.tx+' Mb/s'}</div>`}</div>${h.gpu?`<div class="host-network">${icon('activity',13)} NETWORK · RX ${h.rx} / TX ${h.tx} Mb/s</div>`:''}`}
function hostCard(h){return `<article class="host-card" data-host-card="${h.id}"><div class="host-card-title"><div class="host-title-label">${icon(h.kind,19)}<div><strong>${escapeHtml(h.name)}</strong><div class="host-sub">${escapeHtml(h.role)} / ${escapeHtml(h.ip)}</div></div></div>${badge(h.state)}</div>${hostMetrics(h)}<div class="process-list"><div class="process-caption">TOP 3 PROCESSES · BY CPU · DEMO</div>${processTable(h.processes,h.state==='running')}</div><button class="btn sm" data-host="${h.id}" aria-label="Открыть инспектор ${escapeHtml(h.name)}">${icon('external-link',13)} Инспектор</button></article>`}

function render(page=state.page){state.page=page;$('#crumb').textContent=titles[page]||page;document.querySelectorAll('[data-page]').forEach(b=>{if(b.closest('nav')){if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}});$('#content').innerHTML=({overview,network,containers,models,chat,terminal,kit}[page]||overview)();document.title=`${titles[page]} — SACRA UI / Nocturne demo`;bindSpecial();window.scrollTo({top:0,behavior:'instant'});}
function updateRows(){const input=$('#filterContainer');if(input){let at=input.selectionStart;render('containers');let nxt=$('#filterContainer');nxt?.focus();nxt?.setSelectionRange(at,at)}}
function bindSpecial(){if(state.page==='containers'){$('#filterContainer')?.addEventListener('input',e=>{state.search=e.target.value;updateRows()})}if(state.page==='chat'){$('#send')?.addEventListener('click',sendChat);$('#compose')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});$('#attachBtn')?.addEventListener('click',()=>$('#attach').click());$('#attach')?.addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type))return notify('Поддерживаются PNG, JPEG, WebP, GIF');if(f.size>8*1024*1024)return notify('Демо: до 8 МБ');let reader=new FileReader();reader.onload=()=>{state.messages.push({kind:'me',html:'Изображение прикреплено для локального просмотра.',image:reader.result,fileName:f.name});const msgs=$('#messages');if(msgs){msgs.innerHTML=messages();msgs.scrollTop=msgs.scrollHeight}notify('Изображение добавлено локально; не отправлялось на сервер')};reader.onerror=()=>notify('Не удалось прочитать изображение');reader.readAsDataURL(f)})}if(state.page==='kit')$('#openPaletteFromKit')?.addEventListener('click',openPalette)}
function sendChat(){let c=$('#compose');let raw=c.value.trim();if(!raw)return;state.messages.push({kind:'me',html:escapeHtml(raw).replace(/\n/g,'<br>')});c.value='';const msgs=$('#messages');msgs.innerHTML=messages();msgs.scrollTop=msgs.scrollHeight;notify('Сообщение добавлено только в локальный демо-чат; AI не подключён')}
let paletteReturnFocus=null;
function openPalette(){if($('#commandDialog'))return;paletteReturnFocus=document.activeElement;const root=$('#modalRoot');root.innerHTML=`<div class="dialog" role="presentation" id="commandDialog"><section class="box" role="dialog" aria-modal="true" aria-label="Палитра команд"><div class="eyebrow" style="margin-bottom:12px">/ COMMAND PALETTE</div><input id="paletteSearch" autofocus placeholder="Выберите экран или введите команду…" aria-label="Поиск команды"><div class="quick">${Object.entries(titles).map(([k,t])=>`<button data-goto="${k}">↳ &nbsp; ${t}</button>`).join('')}</div><div class="esc">ESC — закрыть; Enter — первая подходящая команда</div></section></div>`;const inp=$('#paletteSearch');inp.focus();inp.addEventListener('input',()=>{root.querySelectorAll('[data-goto]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(inp.value.toLowerCase()))});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){let first=root.querySelector('[data-goto]:not([hidden])');if(first){render(first.dataset.goto);closePalette(false);$('#content').focus()}}});root.querySelector('#commandDialog').addEventListener('click',e=>{if(e.target.id==='commandDialog')closePalette()});root.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const controls=[...root.querySelectorAll('input,button')].filter(el=>!el.hidden);if(!controls.length)return;const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}})}
function closePalette(restore=true){if(!$('#commandDialog'))return;$('#modalRoot').innerHTML='';if(restore&&paletteReturnFocus?.isConnected)paletteReturnFocus.focus();paletteReturnFocus=null}
function action(id,op){let c=state.containers.find(x=>x.id===id);if(!c)return;if(['start','stop','restart'].includes(op)){if(!confirm(`ДЕМОНСТРАЦИЯ. ${op==='stop'?'Остановить':op==='start'?'Запустить':'Перезапустить'} ${c.name}? Реальный хост не затронут.`))return}if(op==='stop'){c.state='stopped';c.cpu=0}else if(op==='start'){c.state='running';c.cpu=7}else if(op==='restart'){c.state='running';c.cpu=6}notify(`${c.name}: состояние изменено только в макете`);render('containers')}
document.addEventListener('click',e=>{const tgt=e.target.closest('[data-page], [data-action], [data-toast], [data-goto], [data-host]');if(!tgt)return;if(tgt.dataset.host){state.selectedNode=tgt.dataset.host;render('network')}else if(tgt.dataset.page)render(tgt.dataset.page);else if(tgt.dataset.action)action(tgt.dataset.id,tgt.dataset.action);else if(tgt.dataset.toast)notify(tgt.dataset.toast);else if(tgt.dataset.goto){render(tgt.dataset.goto);closePalette(false);$('#content').focus()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape'&&$('#commandDialog')){e.preventDefault();closePalette()}});$('#cmd').addEventListener('click',openPalette);$('#theme').addEventListener('click',()=>{document.body.classList.toggle('paper');state.theme=document.body.classList.contains('paper')?'paper':'night';notify(`Тема: ${state.theme}; ночная — основная`)});function clock(){const n=new Date();$('#clock').textContent=n.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}clock();setInterval(clock,1000);render('overview');
</script>
</body>
</html>
