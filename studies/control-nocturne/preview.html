</aside>
<section class="workspace">
 <header class="top"><div class="crumbs"><span class="mono">SACRA UI</span><span> / </span><strong id="crumb">OVERVIEW</strong><span class="badge mini">DEMO DATA</span></div><div class="topright"><div class="live"><i class="pill-dot"></i><span>LIVE / MOCK</span></div><span class="date mono" id="clock"></span><button class="iconbtn" id="theme" aria-label="Сменить тему" title="Сменить тему">◐</button><button class="iconbtn" id="cmd" aria-label="Палитра команд" title="Палитра команд (Ctrl+K)">⌕ <span class="key">⌘ K</span></button></div></header>
 <main class="content" id="content" tabindex="-1"></main>

<script>
const $=s=>document.querySelector(s);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const state={page:'overview',running:true,theme:'night',search:'',selectedNode:'sacra',containers:[
 {name:'vpn-incy',id:'ct109',host:'sacra',state:'running',cpu:7,mem:'0.7 / 1.5 GB',kind:'LXC'},
 {name:'local-llm',id:'ct104',host:'vivobook',state:'stopped',cpu:0,mem:'0 / 14 GB',kind:'LXC'},
 {name:'runners-host',id:'vm107',host:'sacra',state:'running',cpu:28,mem:'5.2 / 8 GB',kind:'VM'},
 {name:'tencentdb',id:'vm111',host:'sacra',state:'running',cpu:15,mem:'4.8 / 6 GB',kind:'VM'},
 {name:'telemetry-agent',id:'svc204',host:'vivobook',state:'running',cpu:3,mem:'188 MB',kind:'Service'}
],messages:[{kind:'assistant',html:'<strong>Сводка состояния</strong><br>В демо три узла, активны 4 из 5 рабочих нагрузок. Есть предупреждение о повышенной температуре GPU.'},{kind:'assistant',media:true,html:'Вложение отображается как полноценный блок с масштабируемым предпросмотром. Для настоящего TUI нужны графические протоколы терминала и fallback.'},{kind:'me',html:'Покажи нагрузку GPU и список активных контейнеров.'}],chatSession:'Мониторинг инфраструктуры'};
function notify(s){const t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.hidden=true,4200)}
function badge(s){return `<span class="badge ${s==='running'||s==='healthy'?'ok':s==='stopped'?'err':'wait'}"><span class="pill-dot" style="width:5px;height:5px;margin:0;box-shadow:none;background:currentColor"></span>${s==='running'?'работает':s==='stopped'?'остановлен':s}</span>`}
function heading(eyebrow,title,description,right=''){return `<div class="h2line"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${right}</div>`}
function panel(title,small,body,actions=''){return `<section class="panel"><div class="panelhead"><h2>${title}</h2><div class="actions">${small?`<small>${small}</small>`:''}${actions}</div></div><div class="panelbody">${body}</div></section>`}
const points=[34,36,39,37,41,45,43,44,40,48,54,47,51,53,48,45,44,50,55,52,59,58,55,66,58,61,70,65,69,73,62,67,61,66,74,68,71,64,61,58,60,65,69,67,65,73,68,67,73,64];
let gradientSerial=0;
function lineSvg(series=points,color='#b49aff',height=190){let w=900,h=height;let x=i=>i/(series.length-1)*w;let y=v=>h-12-(v/100)*(h-24);let d=series.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');let area=d+` L ${w} ${h} L 0 ${h} Z`;let id='sacra-grad-'+(++gradientSerial);return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Демонстрационный график временного ряда"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${color}" stop-opacity=".26"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${[.23,.48,.73,.98].map(v=>`<line x1="0" x2="${w}" y1="${v*h}" y2="${v*h}" class="axisline"/>`).join('')}<path d="${area}" fill="url(#${id})"/><path d="${d}" stroke="${color}" stroke-width="2.8" fill="none" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function tinyLoad(title,p,palette='load',label=''){return `<div class="barlabel"><span>${title}</span><span>${label||p+'%'}</span></div><div class="loadbar ${palette}" style="--p:${Math.max(0,Math.min(100,p))}%"><i></i></div>`}
function overview(){return `<div class="hero"><div class="circle"></div><div class="stamp">SYS // 00-001</div><div class="inner"><div class="eyebrow">/ HOME LAB <span class="slash">//</span> TELEMETRY SURFACE</div><h1>Система в поле зрения<span style="color:var(--violet)">.</span></h1><p>Концепт расширения Sacra UI Kit: единая семантика мониторинга, контейнеров, чатов и терминальных приложений.</p></div></div><div class="metrics"><div class="metric"><div class="m-title">Узлы сети / NODES</div><div class="number">03 <span>online</span></div><div class="foot"><span class="trend">● 100%</span> доступность</div></div><div class="metric"><div class="m-title">Workloads / сервисы</div><div class="number">04 <span>/ 05</span></div><div class="foot">1 выключен вручную</div></div><div class="metric"><div class="m-title">CPU cluster / load</div><div class="number">38<span>%</span></div><div class="foot"><span class="trend">↗ 3.2%</span> за 15 мин</div></div><div class="metric"><div class="m-title">Alerts / внимание</div><div class="number" style="color:var(--amber)">01</div><div class="foot">Порог температуры GPU</div></div></div><div class="layout"><div class="stack">${panel('Нагрузка инфраструктуры', '60 MIN / SAMPLE',`<div class="sectiontop"><div><div class="chartvalue">38.2<span>% CPU</span></div><div class="chartcap">Агрегированная нагрузка выбранного набора узлов</div></div><span class="badge ok">● ${state.running?'ИМИТАЦИЯ ПОТОКА':'НА ПАУЗЕ'}</span></div><div class="graphwrap">${lineSvg()}</div><div class="xaxis"><span>−60m</span><span>−45m</span><span>−30m</span><span>−15m</span><span>now</span></div><div class="legend"><span><i style="background:var(--violet)"></i>CPU total</span><span><i style="background:var(--cyan)"></i>Агрегация по узлам</span><span><i style="background:var(--amber)"></i>Временной интервал: 60m</span></div>`)}${panel('Вычислительные узлы', 'HOST METRICS',`<div class="nodes"><div class="node"><div class="name">sacra <span style="color:var(--green)">●</span></div><div class="role">PVE / CORE</div><div class="tinybar"><b style="width:52%"></b></div><div class="percent">CPU <strong>52%</strong> / RAM 24 GB</div></div><div class="node"><div class="name">vivobook <span style="color:var(--green)">●</span></div><div class="role">PVE / GPU</div><div class="tinybar"><b style="width:37%;background:var(--cyan)"></b></div><div class="percent">CPU <strong>37%</strong> / RAM 16 GB</div></div><div class="node"><div class="name">edge-01 <span style="color:var(--green)">●</span></div><div class="role">LAN / EDGE</div><div class="tinybar"><b style="width:14%;background:var(--green)"></b></div><div class="percent">CPU <strong>14%</strong> / LOAD LOW</div></div></div><div class="tagline">Это демонстрационные названия, нагрузки и состояния. Подключения к Proxmox и сетевым устройствам нет.</div>`)}${panel('События', 'LAST 4',`<div class="feedline"><div class="when">14:21:08 / INFO</div><div class="message"><b>telemetry-agent</b> — обновлена выборка метрик</div></div><div class="feedline"><div class="when">14:18:33 / WARNING</div><div class="message"><b>GPU-0</b> — температура выше демо-порога</div></div><div class="feedline"><div class="when">14:16:17 / INFO</div><div class="message"><b>vpn-incy</b> — health check OK</div></div><div class="feedline"><div class="when">14:12:09 / INFO</div><div class="message"><b>runner-02</b> — завершено задание</div></div>`)}</div><div class="stack">${panel('GPU / RTX node', 'REAL-TIME STYLE',`${tinyLoad('Утилизация GPU',64,'load','64%')}${tinyLoad('VRAM',79,'memory','12.7 / 16.0 GB')}${tinyLoad('Температура GPU',73,'heat','73 °C')}${tinyLoad('Потребление',71,'power','165 / 230 W')}<div class="kpirow" style="margin-top:16px"><div class="kpi"><span>VRAM PEAK</span><strong>14.3 GB</strong></div><div class="kpi"><span>TEMPERATURE PEAK</span><strong>78 °C</strong></div></div><div class="tagline">Градиенты соответствуют графическим шкалам из kb_gpu.py; цифры в прототипе — макеты.</div>`)}<section class="panel"><div class="panelhead"><h2>Сервисы / HEALTH</h2><span class="badge ok">4 ACTIVE</span></div><div class="service"><div><div class="sname">vpn-incy</div><div class="ssub">ct109 · VPN GATEWAY</div></div>${badge('running')}</div><div class="service"><div><div class="sname">runners-host</div><div class="ssub">vm107 · CI RUNNERS</div></div>${badge('running')}</div><div class="service"><div><div class="sname">local-llm</div><div class="ssub">ct104 · INFERENCE</div></div>${badge('stopped')}</div><div class="service"><div><div class="sname">tencentdb</div><div class="ssub">vm111 · MEMORY DB</div></div>${badge('running')}</div></section>${panel('Статус прототипа', 'UI RESEARCH',`<p style="font-size:12px;color:var(--sub);line-height:1.7;margin:0">Кнопки управления в демо изменяют только локальное состояние в браузере. Для реальных действий необходимы API, роли доступа, аудит и подтверждение опасных операций.</p><button class="btn" style="margin-top:13px" data-page="kit">Открыть токены →</button>`)}</div></div>`}
function network(){return `${heading('/ DISCOVERY','Топология сети','Устройства, сегменты, интерфейсы, маршруты и состояние соединений.', '<span class="badge wait">MOCK TOPOLOGY</span>')}<div class="layout"><div class="stack">${panel('Обнаруженные узлы','LAN / DIAGRAM',`<div class="topomap"><svg viewBox="0 0 900 330" preserveAspectRatio="none"><defs><linearGradient id="wire" x1="0" x2="1"><stop stop-color="#b49aff"/><stop offset="1" stop-color="#73ddf3"/></linearGradient></defs><path d="M450 165 L180 80 M450 165 L720 75 M450 165 L155 255 M450 165 L730 265" stroke="url(#wire)" stroke-width="2" opacity=".68" fill="none" stroke-dasharray="6 7"/><circle cx="450" cy="165" r="76" stroke="#b49aff55" fill="none" stroke-dasharray="4 12"/><circle cx="450" cy="165" r="112" stroke="#b49aff2b" fill="none" stroke-dasharray="2 13"/></svg><div class="netnode center" style="left:50%;top:50%"><strong>core-switch</strong><span class="pill-dot"></span>192.168.31.1</div><div class="netnode" style="left:20%;top:24%"><strong>sacra</strong><span class="pill-dot"></span>host / pve</div><div class="netnode" style="left:80%;top:22%"><strong>vivobook</strong><span class="pill-dot"></span>compute / gpu</div><div class="netnode" style="left:17%;top:77%"><strong>edge-gw</strong><span class="pill-dot"></span>router / vpn</div><div class="netnode" style="left:81%;top:80%"><strong>macbook</strong><span class="pill-dot"></span>workstation</div></div><p class="tagline">Схема намеренно условная. Для реальной сети нужен сбор топологии и алгоритм укладки, а не рисование статичных связей.</p>`)}${panel('Сегменты','VLAN / ADDRESSING',`<div class="tablescroll"><table class="ctable"><thead><tr><th>Сегмент</th><th>CIDR</th><th>Устройства</th><th>Состояние</th></tr></thead><tbody><tr><td><strong>Management</strong></td><td>192.168.31.0/24</td><td>8</td><td>${badge('running')}</td></tr><tr><td><strong>Lab</strong></td><td>10.70.0.0/24</td><td>5</td><td>${badge('running')}</td></tr><tr><td><strong>Guest</strong></td><td>10.80.0.0/24</td><td>2</td><td>${badge('running')}</td></tr></tbody></table></div>`)}</div><div class="stack">${panel('Инспектор устройства', 'SELECTED / DEMO',`<div class="netdetails"><div class="eyebrow">ACTIVE OBJECT</div><h2 style="font-size:22px;letter-spacing:-.04em;margin:12px 0">core-switch</h2>${badge('running')}<div style="margin-top:14px"><div class="rowval"><span>Оборудование</span><b>Switch / Router</b></div><div class="rowval"><span>IP адрес</span><b>192.168.31.1</b></div><div class="rowval"><span>Uptime</span><b>18d 04h</b></div><div class="rowval"><span>Связей</span><b>04</b></div><div class="rowval"><span>Потери</span><b>0.1%</b></div></div><button class="btn" data-toast="Редактор интерфейсов будет доступен после интеграции API">Просмотр интерфейсов</button></div>`)}${panel('Traffic','DEMO / MBPS',`<div class="sectiontop"><div class="chartvalue">684<span>Mbps</span></div><span class="badge mini">RX + TX</span></div><div class="graphwrap">${lineSvg(points.map((v,i)=>v*.63+Math.sin(i*.8)*12),'#73ddf3',145)}</div><div class="xaxis"><span>−60m</span><span>−30m</span><span>now</span></div>`)}</div></div>`}
function containers(){let rows=state.containers.filter(x=>(x.name+' '+x.id+' '+x.host).toLowerCase().includes(state.search.toLowerCase())).map(x=>`<tr><td><strong class="name">${x.name}</strong><div class="tagline" style="margin-top:3px">${x.id} · ${x.kind}</div></td><td>${x.host}</td><td>${badge(x.state)}</td><td><span class="mini-bar" style="--p:${x.cpu}%"></span>${x.cpu}%</td><td>${x.mem}</td><td><div class="actionsCell"><button class="btn sm" data-action="${x.state==='running'?'stop':'start'}" data-id="${x.id}">${x.state==='running'?'Стоп':'Старт'}</button><button class="btn sm ghost" data-action="restart" data-id="${x.id}" aria-label="Перезапустить ${escapeHtml(x.name)} (демо)">↻</button></div></td></tr>`).join('');return `${heading('/ ORCHESTRATION','Контейнеры и виртуальные машины','Управление состояниями, ресурсами, логами и операциями. Все действия в этом демо локальные.',`<span class="badge mini">${state.containers.filter(x=>x.state==='running').length} RUNNING</span>`)}<div class="toolbar"><input id="filterContainer" class="input" placeholder="Поиск: имя, ID, узел…" value="${escapeHtml(state.search)}" aria-label="Фильтр контейнеров"><button class="btn" data-toast="Создание контейнера доступно только после подключения API">+ Создать workload</button></div>${panel('WORKLOAD REGISTRY','HOSTS / ALL',`<div class="tablescroll"><table class="ctable"><thead><tr><th>Имя</th><th>Хост</th><th>Статус</th><th>CPU</th><th>Память</th><th>Действия (демо)</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Совпадений нет</td></tr>'}</tbody></table></div><div class="tagline">В production: ACL/RBAC, MFA или повторная авторизация для критичных операций, двухэтапное подтверждение удаления, асинхронные задачи, статус выполнения и журнал аудита.</div>`)}<div class="datagrid" style="margin-top:16px">${panel('Workload details','SELECT / EXAMPLE',`<div class="kpirow"><div class="kpi"><span>HEALTH CHECK</span><strong style="color:var(--green)">PASS</strong></div><div class="kpi"><span>RESTART COUNT</span><strong>0</strong></div></div>${tinyLoad('CPU quota',28)}${tinyLoad('Memory quota',66,'memory')}<div class="tagline">Макет деталей произвольной VM/LXC. По клику на строку должна открываться боковая панель инспектора.</div>`)}${panel('Recent logs','LIVE / SAMPLE',`<div style="background:#090a11;padding:16px;border:1px solid #343245;border-radius:7px;font:11px/1.8 monospace;color:#9da0aa;overflow:auto"><span style="color:#7be0b4">14:21:08 INFO</span>  service healthy<br><span style="color:#7be0b4">14:20:05 INFO</span>  metrics published<br><span style="color:#ffc478">14:19:59 WARN</span>  delayed sample: 1.2s<br><span style="color:#7be0b4">14:18:46 INFO</span>  health check passed</div><div class="tagline">Логи — пример. В рабочей системе обязателен поток событий, поиск и разграничение прав.</div>`)}</div>`}
function models(){return `${heading('/ ACCELERATION','GPU и модели','Шкалы загрузки, энергопотребления, памяти и активности моделей на основе kb_gpu.py.', '<button class="btn" data-page="terminal">Посмотреть TUI ↗</button>')}<div class="metrics"><div class="metric"><div class="m-title">GPU utilization</div><div class="number">64<span>%</span></div><div class="foot">пик 91%</div></div><div class="metric"><div class="m-title">VRAM allocation</div><div class="number">12.7<span>GB / 16</span></div><div class="foot">пик 14.3 GB</div></div><div class="metric"><div class="m-title">Power draw</div><div class="number">165<span>W</span></div><div class="foot">пик 189 W</div></div><div class="metric"><div class="m-title">Decode throughput</div><div class="number">41.3<span>t/s</span></div><div class="foot">пик 58.1 t/s</div></div></div><div class="datagrid">${panel('NVIDIA GPU','UTIL / TEMPERATURE / POWER',`${tinyLoad('GPU Load / peak 91%',64,'load')}${tinyLoad('VRAM / peak 14.3 GiB',79,'memory','12.7 / 16 GB')}${tinyLoad('GPU temp / peak 78°C',73,'heat','73 °C')}${tinyLoad('Power / peak 189 W',71,'power','165 W')}<div class="tagline">Слои сохранены отдельно: использование ресурсов — количественная шкала; цвет состояния (ОК/предупреждение/критично) — семантический токен.</div>`)}${panel('CPU / SYSTEM','LOAD / MEMORY / THERMAL',`${tinyLoad('CPU Load / 3.7 GHz',42,'load')}${tinyLoad('RAM used / peak 22.8 GB',67,'memory','21.4 / 32 GB')}${tinyLoad('CPU temp',63,'heat','63 °C')}${tinyLoad('CPU Package Power',48,'power','~80 W / ESTIMATE')}<div class="tagline">Мощность и температура обозначаются как измеренные либо оценочные. Если данные недоступны — «нет данных», не ноль.</div>`)}</div><div style="margin-top:16px">${panel('MODEL RUNTIME / llama-swap','TABLE / DEMO',`<div class="tablescroll"><table class="ctable"><thead><tr><th>Модель</th><th>Группа</th><th>Состояние</th><th>TTL</th><th>TPS</th><th>Decode</th><th>Слоты</th><th>Очередь</th><th>VRAM</th><th>TPS peak</th></tr></thead><tbody><tr><td><strong>qwen-small</strong></td><td style="color:#22d3ee">small</td><td>${badge('running')}</td><td>04:29</td><td>41.3</td><td>32.0</td><td>1 / 2</td><td>1 / 0</td><td>3.1 GiB</td><td>58.1</td></tr><tr><td><strong>embedding</strong></td><td style="color:#4ade80">llm</td><td>${badge('running')}</td><td>09:14</td><td>8.7</td><td>7.3</td><td>0 / 1</td><td>0 / 0</td><td>2.2 GiB</td><td>11.4</td></tr><tr><td><strong>large-instruct</strong></td><td style="color:#e879f9">large</td><td>${badge('stopped')}</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>77.2</td></tr></tbody></table></div><div class="tagline">Поля и группы основаны на структуре исходного скрипта, а модельные ID и значения в макете вымышлены.</div>`)}</div>`}

function messages(){return state.messages.map(m=>`<div class="bubwrap ${m.kind==='me'?'me':''}"><div class="avatar">${m.kind==='me'?'◈':'✳'}</div><div class="bubble">${m.html}${m.media?abstractMedia():''}${m.image?`<div class="chatmedia"><img src="${escapeHtml(m.image)}" alt="Прикреплённое пользователем изображение"><div class="caption">${escapeHtml(m.fileName||'image')}</div></div>`:''}<div class="msgmeta">${m.kind==='me'?'YOU':'ASSISTANT'} / DEMO</div></div></div>`).join('')}
function chat(){return `${heading('/ CONVERSATION','Чат, артефакты и изображения','Единые компоненты диалога для веба и терминальных приложений. Сообщения остаются только в этом окне.')}<div class="chatlayout"><section class="panel chatleft"><div class="eyebrow">/ WORKSPACES</div><button class="session selected"><strong>Мониторинг инфраструктуры</strong><small>3 сообщения • текущий диалог</small></button><button class="session" data-toast="Другие диалоги появятся после подключения хранилища"><strong>Проверка сервиса</strong><small>пример другой сессии</small></button><button class="session" data-toast="Другие диалоги появятся после подключения хранилища"><strong>Отчёт по GPU</strong><small>пример другой сессии</small></button><div class="tagline">THREAD LIST / SEARCH / ATTACHMENTS / HISTORY</div></section><section class="panel chatbody"><div class="panelhead" style="border-bottom:1px solid var(--line)"><h2>Мониторинг инфраструктуры</h2><span class="badge ok">LOCAL DEMO</span></div><div class="chatmessages" id="messages">${messages()}</div><div class="chatcomposer"><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" id="attach" style="display:none"><button class="iconbtn" id="attachBtn" aria-label="Прикрепить изображение" title="Прикрепить изображение">＋</button><textarea id="compose" aria-label="Текст сообщения" placeholder="Сообщение… Markdown, код, изображения"></textarea><button class="btn primary" id="send">Отправить ↗</button></div><div class="hint" style="padding:0 18px 13px">Enter — отправка; Shift+Enter — новая строка. Сервер и AI не подключены.</div></section></div>`}

function kit(){let swatches=[["canvas","#0D0E16"],["surface","#151622"],["raised","#1D1F2C"],["sunken","#090A11"],["hover","#282A3B"],["border","#36384A"],["border-strong","#575977"],["text","#F4F2F8"],["muted","#B9B5C6"],["subtle","#9590A5"],["accent","#BCA4FF"],["accent-hover","#D2C1FF"],["accent-soft","rgba(188,164,255,0.10)"],["success","#79DBB1"],["success-soft","rgba(121,219,177,0.10)"],["danger","#FC798D"],["danger-soft","rgba(252,121,141,0.10)"]];let palettes=[['GPU Load','#2ecc71','#f1c40f','#ff4757'],['Memory','#00d2ff','#7b61ff','#ff2e93'],['Thermal','#4facfe','#ffb347','#ff3b3b'],['Power','#a8ff78','#ffd200','#ff6a00']];return `${heading('/ FOUNDATIONS','SACRA / Design System','Фундаментальные токены и общие компоненты веба и TUI. Это предлагаемое расширение Sacra UI Kit, а не замена текущей базы, демонстрационная тема, не установленная в основном репозитории.')}<div class="stack">${panel('Палитра / Semantic Color','NOCTURNE / PROPOSED',`<div class="tokenrow">${swatches.map(([n,c])=>`<div class="swatch"><div class="color" style="--c:${c}"></div><div class="text">${n}</div><div class="hex">${c}</div></div>`).join('')}</div>`)}${panel('Специализированные шкалы','FROM kb_gpu.py',`<div class="panelbody" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0">${palettes.map(p=>`<div><div class="barlabel"><span>${p[0]}</span><span>continuous</span></div><div class="loadbar"><i style="width:100%;background:linear-gradient(90deg,${p.slice(1).join(',')})"></i></div></div>`).join('')}</div><div class="tagline">Цветовые шкалы взяты из приложенного примера. Читабельные подписи и численные значения обязательны, цвет не должен быть единственным источником смысла.</div>`)}${panel('UI-компоненты / states','WEB + TUI',`<div class="kitgrid"><div class="kititem"><h4>Actions</h4><div class="sample"><button class="btn primary" data-toast="Primary action / demo">Primary</button><button class="btn" data-toast="Secondary action / demo">Secondary</button><button class="btn danger" data-toast="Danger action / demo">Danger</button></div></div><div class="kititem"><h4>States</h4><div class="sample">${badge('running')}${badge('stopped')}<span class="badge wait">PENDING</span></div></div><div class="kititem"><h4>Typography</h4><div style="font-size:24px;font-weight:760">Display / 32</div><div class="tagline">Mono 10–12 / labels</div></div><div class="kititem"><h4>Density</h4><p>Comfortable / Dense / TUI compact<br>Плотность данных определяется компонентом.</p></div><div class="kititem"><h4>Focus</h4><div class="sample"><input aria-label="Пример поиска" class="field" placeholder="⌕ Поиск" style="width:100%"></div></div><div class="kititem"><h4>Command surface</h4><div class="sample"><button class="btn" id="openPaletteFromKit">⌘ K / Commands</button><span class="badge mini">KEYBOARD FIRST</span></div></div></div>`)}${panel('Структура исходников','MONOREPO PACKAGE SKETCH',`<div style="background:#090a11;border:1px solid #302e3d;border-radius:7px;padding:16px;color:#c9c3d8;font:11px/1.8 monospace;overflow:auto;white-space:pre">packages/
  design-tokens/          → JSON → CSS vars / TS / Rust / Go
  icons/                  → semantic icon registry / ASCII fallback
  web-ui/                 → components, layouts, docs, stories
  tui-ui/                 → layout contract, glyphs, protocols
  charts/                 → shared visual semantics, render adapters
  domain-model/           → host, metric, workload, message, alert
apps/
  portal/                 → local network management portal
  tui/                    → terminal dashboard and chat
  docs/                   → guidelines, accessibility, QA</div>`)}</div>`}
const titles={overview:'OVERVIEW',network:'NETWORK',containers:'CONTAINERS',models:'GPU / LLM',chat:'CHAT / MEDIA',terminal:'TERMINAL UI',kit:'FOUNDATIONS'};
function render(page=state.page){state.page=page;$('#crumb').textContent=titles[page]||page;document.querySelectorAll('[data-page]').forEach(b=>{if(b.closest('nav')){if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}});$('#content').innerHTML=({overview,network,containers,models,chat,terminal,kit}[page]||overview)();document.title=`${titles[page]} — SACRA UI / Nocturne demo`;bindSpecial();window.scrollTo({top:0,behavior:'instant'});}
function updateRows(){const input=$('#filterContainer');if(input){let at=input.selectionStart;render('containers');let nxt=$('#filterContainer');nxt?.focus();nxt?.setSelectionRange(at,at)}}
function bindSpecial(){if(state.page==='containers'){$('#filterContainer')?.addEventListener('input',e=>{state.search=e.target.value;updateRows()})}if(state.page==='chat'){$('#send')?.addEventListener('click',sendChat);$('#compose')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});$('#attachBtn')?.addEventListener('click',()=>$('#attach').click());$('#attach')?.addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type))return notify('Поддерживаются PNG, JPEG, WebP, GIF');if(f.size>8*1024*1024)return notify('Демо: до 8 МБ');let reader=new FileReader();reader.onload=()=>{state.messages.push({kind:'me',html:'Изображение прикреплено для локального просмотра.',image:reader.result,fileName:f.name});const msgs=$('#messages');if(msgs){msgs.innerHTML=messages();msgs.scrollTop=msgs.scrollHeight}notify('Изображение добавлено локально; не отправлялось на сервер')};reader.onerror=()=>notify('Не удалось прочитать изображение');reader.readAsDataURL(f)})}if(state.page==='kit')$('#openPaletteFromKit')?.addEventListener('click',openPalette)}
function sendChat(){let c=$('#compose');let raw=c.value.trim();if(!raw)return;state.messages.push({kind:'me',html:escapeHtml(raw).replace(/\n/g,'<br>')});c.value='';const msgs=$('#messages');msgs.innerHTML=messages();msgs.scrollTop=msgs.scrollHeight;notify('Сообщение добавлено только в локальный демо-чат; AI не подключён')}
let paletteReturnFocus=null;
function openPalette(){if($('#commandDialog'))return;paletteReturnFocus=document.activeElement;const root=$('#modalRoot');root.innerHTML=`<div class="dialog" role="presentation" id="commandDialog"><section class="box" role="dialog" aria-modal="true" aria-label="Палитра команд"><div class="eyebrow" style="margin-bottom:12px">/ COMMAND PALETTE</div><input id="paletteSearch" autofocus placeholder="Выберите экран или введите команду…" aria-label="Поиск команды"><div class="quick">${Object.entries(titles).map(([k,t])=>`<button data-goto="${k}">↳ &nbsp; ${t}</button>`).join('')}</div><div class="esc">ESC — закрыть; Enter — первая подходящая команда</div></section></div>`;const inp=$('#paletteSearch');inp.focus();inp.addEventListener('input',()=>{root.querySelectorAll('[data-goto]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(inp.value.toLowerCase()))});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){let first=root.querySelector('[data-goto]:not([hidden])');if(first){render(first.dataset.goto);closePalette(false);$('#content').focus()}}});root.querySelector('#commandDialog').addEventListener('click',e=>{if(e.target.id==='commandDialog')closePalette()});root.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const controls=[...root.querySelectorAll('input,button')].filter(el=>!el.hidden);if(!controls.length)return;const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}})}
function closePalette(restore=true){if(!$('#commandDialog'))return;$('#modalRoot').innerHTML='';if(restore&&paletteReturnFocus?.isConnected)paletteReturnFocus.focus();paletteReturnFocus=null}
function action(id,op){let c=state.containers.find(x=>x.id===id);if(!c)return;if(['start','stop','restart'].includes(op)){if(!confirm(`ДЕМОНСТРАЦИЯ. ${op==='stop'?'Остановить':op==='start'?'Запустить':'Перезапустить'} ${c.name}? Реальный хост не затронут.`))return}if(op==='stop'){c.state='stopped';c.cpu=0}else if(op==='start'){c.state='running';c.cpu=7}else if(op==='restart'){c.state='running';c.cpu=6}notify(`${c.name}: состояние изменено только в макете`);render('containers')}
document.addEventListener('click',e=>{const tgt=e.target.closest('[data-page], [data-action], [data-toast], [data-goto]');if(!tgt)return;if(tgt.dataset.page)render(tgt.dataset.page);else if(tgt.dataset.action)action(tgt.dataset.id,tgt.dataset.action);else if(tgt.dataset.toast)notify(tgt.dataset.toast);else if(tgt.dataset.goto){render(tgt.dataset.goto);closePalette(false);$('#content').focus()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape'&&$('#commandDialog')){e.preventDefault();closePalette()}});$('#cmd').addEventListener('click',openPalette);$('#theme').addEventListener('click',()=>{document.body.classList.toggle('paper');state.theme=document.body.classList.contains('paper')?'paper':'night';notify(`Тема: ${state.theme}; ночная — основная`)});function clock(){const n=new Date();$('#clock').textContent=n.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}clock();setInterval(clock,1000);render('overview');
</script>
