name: Validate Postavki frontend refresh
on:
  push:
    branches: [sync/postavki-20261002]
permissions:
  contents: write
concurrency:
  group: sacra-postavki-refresh
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Sacraer-group/sacra-ui-kit' && !startsWith(github.event.head_commit.message, 'build:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
      - name: Integrate into current multi-file site
        run: |
          python3 .sync/apply.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/tests/postavki_browser.py')
          s = p.read_text()
          s = s.replace("document.querySelectorAll('[data-doc-language]')", "document.querySelectorAll('[role=tab][data-doc-language]')")
          p.write_text(s)
          PY
      - name: Syntax and WASM smoke checks
        run: |
          for f in site/src/*.js site/examples/postavki.js; do node --check "$f"; done
          python3 -m py_compile site/tests/postavki_browser.py
          node site/tests/wasm.test.cjs
      - name: Install test browser
        run: |
          python3 -m pip install 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium
      - name: Browser regression checks
        run: python3 site/tests/postavki_browser.py
      - name: Commit tested integration on staging branch
        run: |
          python3 .sync/apply.py --checksums-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site skills README.md AGENTS.md
          git commit -m 'build: integrate and verify Postavki frontend patterns'
          git push origin HEAD:sync/postavki-20261002
