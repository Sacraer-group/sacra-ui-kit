name: Import SACRA UI kit
on:
  push:
    branches: [main]
    paths: ['.import/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sacra-initial-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'Sacraer-group/sacra-ui-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify private repository and import verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          python3 .import/restore.py
      - name: Check imported source
        run: |
          python3 scripts/package.py
          python3 tests/skills_test.py
          node tests/wasm.test.cjs
          for file in src/*.js wasm/geometry-binary.js; do node --check "$file"; done
      - name: Commit imported kit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .import .github/workflows/import-kit.yml
          git add --all
          git commit -m 'feat: import SACRA UI 1.4.3 and reusable agent skills'
          git push origin HEAD:main
