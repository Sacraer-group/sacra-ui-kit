name: Import SACRA UI kit
on:
  push:
    branches: [main]
    paths: ['.import/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sacra-initial-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'Sacraer-group/sacra-ui-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify private repository and restore checked source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          python3 .import/restore.py
      - name: Build and check imported source
        run: |
          python3 scripts/package.py
          python3 tests/skills_test.py
          node tests/wasm.test.cjs
          for file in src/*.js wasm/geometry-binary.js; do node --check "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          expected = {'index.html': 'bbd996abb818b57b9987d4c58bc5b7676065fb7b86afdd678ed76197bad5f645', 'sacra-ui.css': '8f74803170fb5c9bd354fd0a0bdba38d68d95566924ce8600942d6dfd2d7a912'}
          for file, digest in expected.items():
              assert sha256(Path(file).read_bytes()).hexdigest() == digest, file
          print('UI artifacts exactly match the supplied SACRA UI 1.4.3')
          PY
      - name: Verify real Skills CLI discovery without installing
        env:
          DISABLE_TELEMETRY: '1'
        run: npx --yes skills add ./skills --list
      - name: Commit imported kit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .import
          git add --all
          git commit -m 'feat: import SACRA UI 1.4.3 and four portable agent skills'
          git push origin HEAD:main
