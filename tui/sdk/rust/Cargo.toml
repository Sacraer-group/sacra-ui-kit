[package]
name = "sacra-tui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native SACRA terminal blocks, cell rendering and topology in Rust"

[features]
default = []
terminal = ["dep:crossterm", "dep:ctrlc"]
ratatui = ["dep:ratatui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
crossterm = { version = "0.29", optional = true }
ctrlc = { version = "3.4", features = ["termination"], optional = true }
ratatui = { version = "0.30.2", default-features = false, optional = true }

[[bin]]
name = "sacra-tui-rs"
path = "src/bin/sacra-tui-rs.rs"

[[example]]
name = "ratatui"
required-features = ["ratatui"]
