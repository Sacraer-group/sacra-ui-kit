[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "sacra-tui"
version = "0.1.0"
description = "SACRA native terminal block SDK: Python adapter for the Go renderer"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["sacra_tui*"]
